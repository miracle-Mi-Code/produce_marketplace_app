# Render Blueprint configuration for Produce Marketplace App
services:
  - type: web
    name: farmdirect-produce-marketplace
    env: node
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: produce-marketplace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

databases:
  - name: produce-marketplace-db
    databaseName: produce_marketplace
    user: postgres_user
